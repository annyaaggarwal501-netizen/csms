<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#221a1f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/vt.js"></script>
</head>
<body>
<div class="login-page">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="shop">
      <div class="mark" id="mark">&nbsp;</div>
      <h1 style="margin:0" id="shopName">&nbsp;</h1>
      <div class="muted small">Shop manager · billing, stock & customers</div>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" id="togglePw">Show</button>
      </div>
    </div>
    <div id="err" class="field"></div>
    <button class="primary big" style="width:100%" id="loginBtn">Log in</button>
    <p class="muted small hidden" id="demo" style="margin-top:1rem;text-align:center"></p>
  </form>
</div>
<script src="js/app.js"></script>
<script>
  const pw = document.getElementById('password');
  try { sessionStorage.removeItem('csms:shell'); } catch (e) { /* ignore */ }   // the next login may be someone else
  try { const u = localStorage.getItem('csms:lastUser'); if (u) { document.getElementById('username').value = u; pw.focus(); } } catch (e) { /* ignore */ }
  api('/public/login-info').then(i => {
    document.getElementById('shopName').textContent = i.shopName;
    document.getElementById('mark').textContent = (i.shopName || 'S')[0];
    document.title = 'Log in – ' + i.shopName;
    // Only the demo logins that still work are shown (none once their passwords were changed).
    const demo = (i.demoLogins || []).map(d => `${esc(d.username)} / ${esc(d.password)}`).join(' · ');
    document.getElementById('demo').innerHTML = demo ? 'Demo: ' + demo : '';
    document.getElementById('demo').classList.toggle('hidden', !demo);
  }).catch(() => {});
  document.getElementById('togglePw').onclick = e => {
    pw.type = pw.type === 'password' ? 'text' : 'password';
    e.target.textContent = pw.type === 'password' ? 'Show' : 'Hide';
  };
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    try {
      const me = await api('/auth/login', { method: 'POST', body: {
        username: document.getElementById('username').value, password: pw.value } });
      try { localStorage.setItem('csms:lastUser', me.username); } catch (e) { /* ignore */ }
      const next = param('next');
      location.href = next && /^[a-z-]+\.html(\?[^/]*)?$/.test(next) && !next.startsWith('login') ? next : homeFor(me);
    } catch (err) {
      showError(document.getElementById('err'), err);
      pw.value = '';
      pw.focus();
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
