spring.application.name=csms
server.port=${PORT:8080}

# Settings can come from a .env file in the folder the app is started from (KEY=value per line).
# Use it for the cloud database password; .env is in .gitignore so it never goes to GitHub.
spring.config.import=optional:file:.env[.properties]

# ---- Database (PostgreSQL: Neon cloud or local). Secrets come from environment variables or .env (REQ-SEC-4). ----
# DB_SSL_MODE: "prefer" for PostgreSQL on this laptop, "require" for Neon (encrypted connection).
# Times are in India time: the app sets its time zone to Asia/Kolkata at start (CsmsApplication), and every
# database connection is switched to India time too (Neon's servers run on UTC).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clothing_shop}?sslmode=${DB_SSL_MODE:prefer}&ApplicationName=csms
spring.datasource.username=${DB_USER:csms}
spring.datasource.password=${DB_PASSWORD:csms_dev_pw}
# Neon's free plan allows a limited number of connections; 5 is plenty for a shop.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'

# Flyway owns the schema: V1 (tables), V2 (seed data), V3 + V4 (prototype additions), V5 (product images).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Product import files: the app itself rejects files over 5 MB with ERR-PRD-001 (REQ-PRD-5).
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ---- Session cookie (REQ-ACC-2): HttpOnly, SameSite=Strict, 30 min inactivity ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Set to true when you run behind HTTPS (REQ-SEC-1).
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Shop details printed on receipts ----
csms.shop.name=Mansi Collection
csms.shop.address=Main Bazaar, Kotputli, Rajasthan
csms.shop.gstin=08ABCDE1234F1Z5
csms.shop.phone=9000000000
csms.shop.location-url=https://maps.google.com/?q=Mansi+Collection+Kotputli

# ---- Business rules (data-driven, REQ-MNT-4) ----
csms.rules.staff-discount-limit-percent=10
csms.rules.return-window-days=7
csms.rules.credit-note-validity-days=90
csms.rules.points-per-100=1

# ---- WhatsApp (Click-to-Chat mode only in the prototype) ----
# Public base URL used inside e-bill links. Leave blank to use the address the browser used.
# For a phone to open the link, use the laptop's Wi-Fi IP (e.g. http://192.168.1.20:8080) or a tunnel URL.
csms.public-base-url=${PUBLIC_BASE_URL:}
# Secret used to sign e-bill links so they cannot be guessed. CHANGE for any real use.
csms.link-secret=${LINK_SECRET:dev-only-change-me-7f3a9c}

logging.level.org.hibernate.SQL=warn

# ---- Real shop vs demo ----
# DEMO_MODE=false hides the demo logins on the login page and makes anyone still using a demo password change it.
csms.demo-mode=${DEMO_MODE:true}

# ---- Speed ----
# gzip text responses (JSON, HTML, JS, CSS): pages load 3-5x less data on a phone connection.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml,text/plain
server.compression.min-response-size=1024
# Browsers keep the app's files but check for a newer version each time (cheap 304 answer), so updates show at once.
spring.web.resources.cache.cachecontrol.no-cache=true
# Behind Render / any HTTPS proxy: trust X-Forwarded-* so links and redirects use https.
server.forward-headers-strategy=framework
